<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mercury Facts</title>
    <style>
        body {
            background-color: black;
            color: wheat;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            margin: 0 100px;
            font-weight: bold;
            border: 3px double powderblue;
        }

        .fact-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 800px;
            margin: auto;
        }

        .fact-text {
            font-size: 18px;
            max-width: 500px;
        }

        .fact-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-buttons button {
            background-color: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .nav-buttons button:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>

<div class="fact-container">
    <p id="fact-text" class="fact-text">Mercury is the closest planet to the Sun.</p>
    <img id="fact-image" class="fact-image" src="../dyn.avif" alt="Mercury" >
</div>

<div class="nav-buttons">
    <button onclick="prevFact()">&#8592;</button>
    <button onclick="nextFact()">&#8594;</button>
</div>

<script>
    let facts = [
        { text: "Mercury is the closest planet to the Sun."},
        { text: "A day on Mercury lasts 176 Earth days." },
        { text: "Mercury has no moons or rings."},
        { text: "Temperatures on Mercury range from 430°C to -180°C." },
        { text: "Mercury's core makes up about 85% of the planet's radius." }
    ];

    let currentIndex = 0;

    function updateFact() {
        document.getElementById("fact-text").textContent = facts[currentIndex].text;
    }

    function nextFact() {
        currentIndex = (currentIndex + 1) % facts.length;
        updateFact();
    }

    function prevFact() {
        currentIndex = (currentIndex - 1 + facts.length) % facts.length;
        updateFact();
    }
</script>

</body>
</html>
