<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Venus Facts</title>
    <style>
        body {
            background-color: #1e0e04;
            color: #ffd7a8;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            margin: 0 100px;
            font-weight: bold;
            border: 3px double #ff80ab;
        }

        .fact-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 800px;
            margin: auto;
        }

        .fact-text {
            font-size: 18px;
            max-width: 600px;
        }

        .fact-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            
        }

        .nav-buttons button {
            background-color: transparent;
            border: 2px solid #ffd7a8;
            color: #ffd7a8;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .nav-buttons button:hover {
            background-color: #ffd7a8;
            color: #1e0e04;
        }
    </style>
</head>
<body>

<div class="fact-container">
    <p id="fact-text" class="fact-text">Venus is the hottest planet in the solar system.</p>
    <img id="fact-image" class="fact-image" src="../dyn.avif" alt="Venus">
</div>

<div class="nav-buttons">
    <button onclick="prevFact()">&#8592;</button>
    <button onclick="nextFact()">&#8594;</button>
</div>

<script>
    let facts = [
        { text: "Venus is the hottest planet in the solar system." },
        { text: "A day on Venus is longer than its year." },
        { text: "Venus rotates in the opposite direction to most planets." },
        { text: "The atmosphere of Venus is mainly carbon dioxide." },
        { text: "Venus has no moons or rings." }
    ];

    let currentIndex = 0;

    function updateFact() {
        document.getElementById("fact-text").textContent = facts[currentIndex].text;
    }

    function nextFact() {
        currentIndex = (currentIndex + 1) % facts.length;
        updateFact();
    }

    function prevFact() {
        currentIndex = (currentIndex - 1 + facts.length) % facts.length;
        updateFact();
    }
</script>

</body>
</html>
