
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenticular Galaxies</title>
    <style>
        body {
            background-color: rgb(0, 0, 0);
            color: wheat;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            margin-left:100px;
            margin-right: 100px;
            font-weight: bold;
            border:3px double powderblue;
        }
        .fact-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 800px;
            margin: auto;
        }
        .fact-text {
            font-size: 18px;
            max-width: 600px;
        }
        .fact-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        .nav-buttons button {
            background-color: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        .nav-buttons button:hover {
            background-color: white;
            color: rgb(70, 69, 69);
        }
    </style>
</head>
<body>
    <div class="fact-container">
        <p id="fact-text" class="fact-text">Lenticular galaxies have a central bulge and a disk but lack spiral arms.</p>
        <img id="fact-image" class="fact-image" src="len.jpg" alt="Lenticular">
    </div>
    <div class="nav-buttons">
        <button onclick="prevFact()">&#8592;</button>
        <button onclick="nextFact()">&#8594;</button>
    </div>
    <script>
        let facts = [{"text": "Lenticular galaxies have a central bulge and a disk but lack spiral arms.", "image": "len.jpg"}, {"text": "They are considered a transition type between spiral and elliptical galaxies.", "image": "spiral.jpg"}, {"text": "These galaxies have older star populations and little interstellar matter.", "image": "old.jpg"}, {"text": "Their smooth disk appearance can be mistaken for elliptical galaxies from afar.", "image": "elliptical.jpeg"}];
        let currentIndex = 0;
        function updateFact() {
            document.getElementById("fact-text").textContent = facts[currentIndex].text;
            document.getElementById("fact-image").src = facts[currentIndex].image;
        }
        function nextFact() {
            currentIndex = (currentIndex + 1) % facts.length;
            updateFact();
        }
        function prevFact() {
            currentIndex = (currentIndex - 1 + facts.length) % facts.length;
            updateFact();
        }
    </script>
</body>
</html>
