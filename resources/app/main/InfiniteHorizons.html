<!DOCTYPE html>
<html>
<head>
    <title>Infinite Horizons Signup</title>
    <link rel="icon" type="image/png" href="logo.png">

    <script>
        function validateForm(event) {
            event.preventDefault(); // Stop form from submitting by default

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const username = document.getElementById("username").value.trim();
            const age = document.getElementById("age").value;
            const phone = document.getElementById("phone").value.trim();
            const address = document.getElementById("address").value.trim();
            const dob = document.getElementById("dob").value;

            if (!email || !password || !username || !age || !phone || !address || !dob) {
                alert("Please fill in all fields.");
                return false;
            }

            if (!email.includes("@")) {
                alert("Please enter a valid email address.");
                return false;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters long.");
                return false;
            }

            if (isNaN(age) || age < 0|| age > 120) {
                alert("Please enter a valid age between 13 and 120.");
                return false;
            }

            if (!/^\d{10}$/.test(phone)) {
                alert("Please enter a valid 10-digit phone number.");
                return false;
            }

            // If everything is valid, redirect to logout.html
            window.location.href = "logout.html";
            return true;
        }
    </script>
</head>

<style>
    body {
        display: flex;
        background-color: #0d1117;
        color: white;
        font-family: Georgia, 'Times New Roman', Times, serif;
        height: 100vh;
        margin: 0;
        text-indent: 50px;
        letter-spacing: 4px;
        word-spacing: 10px;
        line-height: 20px;
        text-shadow: 2px 2px rgb(240, 127, 228);
    }

    .left {
        flex: 1;
        background-image: url("12345.jpeg");
        background-repeat: no-repeat;
        background-size: cover;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    .right {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #161b22;
        padding: 20px;
    }

    input, textarea {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
        color: white;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #238636;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
    }
</style>

<body>
    <div class="left">
        <center>
            <h1>Create Your Account</h1>
            <h3>Stay updated on the latest discoveries and dive into the wonders of the universe.</h3>
        </center>
    </div>

    <div class="right">
        <form onsubmit="validateForm(event)">
            <div>
                <h2>Sign Up To Infinite Horizons</h2>

                <input id="email" type="text" placeholder="Email" required />
                <input id="password" type="text" placeholder="Password" required />
                <input id="username" type="text" placeholder="Username" required />
                <input id="age" type="text" placeholder="Age" required />
                <input id="phone" type="text" placeholder="Phone Number" required />
                <textarea id="address" cols="100" rows="4" placeholder="Home Address" required></textarea>

                <label>Date of Birth:</label>
                <input id="dob" type="date" required />

                <button type="submit">Continue →</button>
            </div>
        </form>
    </div>
</body>
</html>
