<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Facts</title>
    <style>
        body {
            background-color: rgb(0, 0, 0);
            color: wheat;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            margin-left: 100px;
            padding: 5px;
            margin-right: 100px;
            font-weight: bold;
            border: 3px double powderblue;
        }

        .fact-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 800px;
            margin: auto;
        }

        .fact-text {
            font-size: 18px;
            max-width: 600px;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-buttons button {
            background-color: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .nav-buttons button:hover {
            background-color: white;
            color: rgb(70, 69, 69);
        }
    </style>
</head>
<body>

    <div class="fact-container">
        <p id="fact-text" class="fact-text"></p>
    </div>

    <div class="nav-buttons">
        <button onclick="prevFact()">&#8592;</button> <!-- Left arrow -->
        <button onclick="nextFact()">&#8594;</button> <!-- Right arrow -->
    </div>

    <script>
        let facts = [
  { text: "1️⃣ ☄️ Comets are ancient leftovers from the early solar system — over 4.6 billion years old!" },
  { text: "2️⃣ 🧲 Comet tails can have two parts: a dust tail and an ion tail, each pointing in different directions." },
  { text: "3️⃣ 🌠 Halley’s Comet is visible from Earth every 76 years — last seen in 1986, next in 2061!" },
  { text: "4️⃣ 🚀 Comets can travel at speeds of over 100,000 kilometers per hour!" },
  { text: "5️⃣ 🧭 Some ancient cultures believed comets were omens of disaster or change." },
  { text: "6️⃣ 🌬️ A comet's coma (the glowing cloud around its nucleus) can be larger than the Sun!" },
  { text: "7️⃣ 🧊 The nucleus of a comet is usually only a few kilometers wide, despite its huge tail." },
  { text: "8️⃣ 🌍 Earth has been hit by comet debris before — that's what causes meteor showers like the Perseids!" },
  { text: "9️⃣ 👨‍🔬 Comets helped scientists discover solar wind and study the early solar system." },
  { text: "🔟 🪐 Comets don't orbit neatly — their orbits are long, stretched ovals that can take centuries to complete." },
  { text: "1️⃣1️⃣ 🪞 The first recorded observation of Halley’s Comet dates back to 240 BC in China!" },
  { text: "1️⃣2️⃣ 💥 Some comets can disintegrate after close approaches to the Sun due to extreme heat." },
  { text: "1️⃣3️⃣ 🔭 The word 'comet' comes from the Greek *komētēs*, meaning 'long-haired' — describing its glowing tail." },
  { text: "1️⃣4️⃣ 🌌 There could be billions of comets lurking in the distant Oort Cloud." },
  { text: "1️⃣5️⃣ 🧪 Comet 67P smells bad — like rotten eggs, ammonia, and formaldehyde, scientists say!" }
];



        let currentIndex = 0;

        function updateFact() {
            document.getElementById("fact-text").textContent = facts[currentIndex].text;
        }

        function nextFact() {
            currentIndex = (currentIndex + 1) % facts.length;
            updateFact();
        }

        function prevFact() {
            currentIndex = (currentIndex - 1 + facts.length) % facts.length;
            updateFact();
        }

        // ✅ Initialize first fact
        updateFact();
    </script>

</body>
</html>
