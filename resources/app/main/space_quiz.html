<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Space Quiz | Infinite Horizons</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0b0f1a, #1a1f2e);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .quiz-container {
      background-color: #141a2b;
      border-radius: 10px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
    }
    .question {
      font-size: 22px;
      margin-bottom: 20px;
    }
    .options button {
      background-color: #1f2937;
      border: 2px solid #f4beff;
      color: #fff;
      padding: 10px 20px;
      margin: 10px 0;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 16px;
    }
    .options button:hover {
      background-color: #f4beff;
      color: #000;
    }
    .result {
      font-size: 18px;
      margin-top: 10px;
      height: 24px;
    }
    .timer {
      font-size: 18px;
      margin-bottom: 20px;
      color: #ff5252;
    }
    #scoreBoard {
      font-size: 20px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h2>🌠 Space Quiz</h2>
    <div class="timer" id="timer">Time Left: 10s</div>
    <div class="question" id="question">Loading...</div>
    <div class="options" id="options"></div>
    <div class="result" id="result"></div>
    <div id="scoreBoard"></div>
  </div>

  <script>
    const questions = [
      {
        question: "What is the name of the largest moon of Saturn?",
        options: ["Titan", "Europa", "Ganymede", "Callisto"],
        answer: "Titan"
      },
      {
        question: "Which planet has the shortest day?",
        options: ["Mercury", "Venus", "Jupiter", "Mars"],
        answer: "Jupiter"
      },
      {
        question: "What is the Great Red Spot on Jupiter?",
        options: ["A volcano", "A storm", "A crater", "An ocean"],
        answer: "A storm"
      },
      {
        question: "Which planet is the hottest in our solar system?",
        options: ["Mercury", "Venus", "Mars", "Jupiter"],
        answer: "Venus"
      },
      {
        question: "What is the name of the closest galaxy to the Milky Way?",
        options: ["Andromeda", "Triangulum", "Large Magellanic Cloud", "Sombrero"],
        answer: "Andromeda"
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 10;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const resultEl = document.getElementById("result");
    const timerEl = document.getElementById("timer");
    const scoreBoardEl = document.getElementById("scoreBoard");

    function loadQuestion() {
      clearInterval(timerInterval);
      timeLeft = 10;
      timerEl.textContent = `Time Left: ${timeLeft}s`;
      timerInterval = setInterval(updateTimer, 1000);

      const q = questions[currentQuestionIndex];
      questionEl.textContent = q.question;
      optionsEl.innerHTML = "";
      resultEl.textContent = "";

      q.options.forEach(opt => {
        const button = document.createElement("button");
        button.textContent = opt;
        button.onclick = () => handleAnswer(opt);
        optionsEl.appendChild(button);
      });
    }

    function updateTimer() {
      timeLeft--;
      timerEl.textContent = `Time Left: ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        resultEl.textContent = `⏰ Time's up! Correct: ${questions[currentQuestionIndex].answer}`;
        disableOptions();
        setTimeout(nextQuestion, 2000);
      }
    }

    function handleAnswer(selected) {
      clearInterval(timerInterval);
      const correct = questions[currentQuestionIndex].answer;
      if (selected === correct) {
        resultEl.textContent = "✅ Correct!";
        score++;
      } else {
        resultEl.textContent = `❌ Wrong! Correct answer: ${correct}`;
      }
      disableOptions();
      setTimeout(nextQuestion, 2000);
    }

    function disableOptions() {
      const buttons = optionsEl.querySelectorAll("button");
      buttons.forEach(btn => btn.disabled = true);
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showScore();
      }
    }

    function showScore() {
      questionEl.style.display = "none";
      optionsEl.style.display = "none";
      timerEl.style.display = "none";
      resultEl.style.display = "none";
      scoreBoardEl.style.display = "block";
      scoreBoardEl.textContent = `🎉 Quiz Completed! Your Score: ${score}/${questions.length}`;
    }

    loadQuestion();
  </script>
</body>
</html>
