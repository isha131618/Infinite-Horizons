<!DOCTYPE html>
<html>
<head>
    <title>Infinite Horizons Signup</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script>
        function validateForm(event) {
            event.preventDefault(); // Prevent the form from submitting

            // Get input values
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const username = document.getElementById("username").value.trim();

            // Basic validation
            if (!email || !password || !username) {
                alert("Please fill in all required fields.");
                return false;
            }

            if (!email.includes("@") || !email.includes(".")) {
                alert("Please enter a valid email address.");
                return false;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return false;
            }

            if (username.length < 3) {
                alert("Username must be at least 3 characters.");
                return false;
            }

            // Redirect if validation is successful
            window.location.href = "logout.html";
            return true;
        }
    </script>
</head>

<style>
    body {
        display: flex;
        background-color: #0d1117;
        color: white;
        font-family: Georgia, 'Times New Roman', Times, serif;
        height: 100vh;
        margin: 0;
        text-indent: 50px;
        letter-spacing: 4px;
        word-spacing: 10px;
        line-height: 20px;
        text-shadow: 2px 2px rgb(240, 127, 228);
    }

    .left {
        flex: 1;
        background-image: url("12345.jpeg");
        background-repeat: no-repeat;
        background-size: cover;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    .right {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #161b22;
        padding: 20px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
        color: white;
        font-size: 16px;
    }

    textarea {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
        color: white;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #238636;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
        margin: 10px;
    }

    a {
        color: #58a6ff;
        text-decoration: none;
    }
</style>

<body>
    <div class="left">
        <center>
            <h1>Create Your Account</h1>
            <h3>Stay updated on the latest discoveries and dive into the wonders of the universe.</h3>
        </center>
    </div>

    <div class="right">
        <form onsubmit="validateForm(event)">
            <div>
                <h2>Sign Up To Infinite Horizons</h2>

                <input id="email" type="text" placeholder="Email" required />
                <input id="password" type="password" placeholder="Password" required />
                <input id="username" type="text" placeholder="Username" required />

                <center>
                    <a href="InfiniteHorizons.html" style="font-family: 'Courier New', Courier, monospace; font-size: 0.9em;">
                        If U don't have an Account SignUp
                    </a>
                </center>

                <button type="submit">Continue</button>
            </div>
        </form>
    </div>
</body>
</html>
