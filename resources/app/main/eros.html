<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Facts</title>
    <style>
        body {
            background-color: rgb(0, 0, 0);
            color: wheat;
           
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            margin-left:100px;
            margin-right: 100px;
            font-weight: bold;
            border:3px double powderblue;
            
        }

        .fact-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 800px;
            margin: auto;
        }

        .fact-text {
            font-size: 18px;
            max-width: 600px;
        }

        .fact-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-buttons button {
            background-color: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .nav-buttons button:hover {
            background-color: white;
            color: rgb(70, 69, 69);
        }
    </style>
</head>
<body>

    
    <div class="fact-container">
        <p id="fact-text" class="fact-text">NASA’s NEAR Shoemaker spacecraft became the first to orbit an asteroid in 2000 and made a historic soft landing on Eros in 2001, even though it wasn't designed for landing.
        </p>
        <img id="fact-image" class="fact-image" src="shoemaker.jpg" alt="Eris">
    </div>

    <div class="nav-buttons">
        <button onclick="prevFact()">&#8592;</button> <!-- Left arrow -->
        <button onclick="nextFact()">&#8594;</button> <!-- Right arrow -->
    </div>

    <script>
        let facts = [
            { text: "NASA’s NEAR Shoemaker spacecraft became the first to orbit an asteroid in 2000 and made a historic soft landing on Eros in 2001, even though it wasn't designed for landing.", image: "shoemaker.jpg" },
            { text: "Unlike round planets, Eros has an irregular, peanut-like shape, measuring about 34.4 km (21.4 mi) long and 11.2 km (7 mi) wide.", image: "eros.jpg" },
            { text: "While not an immediate threat, Eros' orbit crosses Earth’s path, meaning it could pose a collision risk in millions of years if its trajectory changes.", image: "collision.jpg" },
        ];

        let currentIndex = 0;

        function updateFact() {
            document.getElementById("fact-text").textContent = facts[currentIndex].text;
            document.getElementById("fact-image").src = facts[currentIndex].image;
        }

        function nextFact() {
            currentIndex = (currentIndex + 1) % facts.length;
            updateFact();
        }

        function prevFact() {
            currentIndex = (currentIndex - 1 + facts.length) % facts.length;
            updateFact();
        }
    </script>

</body>
</html>
