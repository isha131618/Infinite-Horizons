<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar System Quiz | Infinite Horizons</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0b0f1a, #1a1f2e);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .quiz-container {
      background-color: #141a2b;
      border-radius: 10px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
    }
    .question {
      font-size: 22px;
      margin-bottom: 20px;
    }
    .options button {
      background-color: #1f2937;
      border: 2px solid #f4beff;
      color: #fff;
      padding: 10px 20px;
      margin: 10px 0;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 16px;
    }
    .options button:hover {
      background-color: #f4beff;
      color: #000;
    }
    .result {
      font-size: 18px;
      margin-top: 10px;
      height: 24px;
    }
    .timer {
      font-size: 18px;
      margin-bottom: 20px;
      color: #ff5252;
    }
    #scoreBoard {
      font-size: 20px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h2>🪐 Solar System Quiz</h2>
    <div class="timer" id="timer">Time Left: 10s</div>
    <div class="question" id="question">Loading...</div>
    <div class="options" id="options"></div>
    <div class="result" id="result"></div>
    <div id="scoreBoard"></div>
  </div>

  <script>
    const questions = [
      {
        question: "Which planet has the most moons?",
        options: ["Jupiter", "Saturn", "Uranus", "Neptune"],
        answer: "Saturn"
      },
      {
        question: "What is the hottest planet in our solar system?",
        options: ["Mercury", "Venus", "Mars", "Jupiter"],
        answer: "Venus"
      },
      {
        question: "Which planet spins on its side?",
        options: ["Venus", "Mars", "Uranus", "Neptune"],
        answer: "Uranus"
      },
      {
        question: "What is the largest moon in our solar system?",
        options: ["Titan", "Ganymede", "Moon", "Europa"],
        answer: "Ganymede"
      },
      {
        question: "Which planet has a giant storm called the Great Red Spot?",
        options: ["Saturn", "Jupiter", "Neptune", "Mars"],
        answer: "Jupiter"
      },
      {
        question: "What is the name of the dwarf planet in the asteroid belt?",
        options: ["Pluto", "Eris", "Ceres", "Makemake"],
        answer: "Ceres"
      },
      {
        question: "Which planet has the shortest day?",
        options: ["Mercury", "Venus", "Jupiter", "Mars"],
        answer: "Jupiter"
      },
      {
        question: "What is the name of Saturn's largest moon?",
        options: ["Titan", "Enceladus", "Rhea", "Iapetus"],
        answer: "Titan"
      },
      {
        question: "Which planet is known as the 'Morning Star'?",
        options: ["Mercury", "Venus", "Mars", "Jupiter"],
        answer: "Venus"
      },
      {
        question: "What is the name of Neptune's largest moon?",
        options: ["Triton", "Proteus", "Nereid", "Larissa"],
        answer: "Triton"
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 15; // Increased time for more challenging questions

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const resultEl = document.getElementById("result");
    const timerEl = document.getElementById("timer");
    const scoreBoardEl = document.getElementById("scoreBoard");

    function loadQuestion() {
      clearInterval(timerInterval);
      timeLeft = 15;
      timerEl.textContent = `Time Left: ${timeLeft}s`;
      timerInterval = setInterval(updateTimer, 1000);

      const q = questions[currentQuestionIndex];
      questionEl.textContent = q.question;
      optionsEl.innerHTML = "";
      resultEl.textContent = "";

      // Shuffle options to make quiz more dynamic
      const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
      
      shuffledOptions.forEach(opt => {
        const button = document.createElement("button");
        button.textContent = opt;
        button.onclick = () => handleAnswer(opt);
        optionsEl.appendChild(button);
      });
    }

    function updateTimer() {
      timeLeft--;
      timerEl.textContent = `Time Left: ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        resultEl.textContent = `⏰ Time's up! Correct: ${questions[currentQuestionIndex].answer}`;
        disableOptions();
        setTimeout(nextQuestion, 2000);
      }
    }

    function handleAnswer(selected) {
      clearInterval(timerInterval);
      const correct = questions[currentQuestionIndex].answer;
      if (selected === correct) {
        resultEl.textContent = "✅ Correct! +1";
        score++;
      } else {
        resultEl.textContent = `❌ Wrong! Correct: ${correct}`;
      }
      disableOptions();
      setTimeout(nextQuestion, 2000);
    }

    function disableOptions() {
      const buttons = optionsEl.querySelectorAll("button");
      buttons.forEach(btn => btn.disabled = true);
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showScore();
      }
    }

    function showScore() {
      questionEl.style.display = "none";
      optionsEl.style.display = "none";
      timerEl.style.display = "none";
      resultEl.style.display = "none";
      scoreBoardEl.style.display = "block";
      
      const percentage = Math.round((score / questions.length) * 100);
      let message;
      if (percentage >= 80) message = "🚀 Astronaut Material!";
      else if (percentage >= 60) message = "🌟 Space Enthusiast!";
      else message = "🌎 Keep Exploring!";
      
      scoreBoardEl.innerHTML = `
        <h3>${message}</h3>
        <p>Your Score: ${score}/${questions.length} (${percentage}%)</p>
        <button onclick="location.reload()">♻️ Try Again</button>
      `;
    }

    loadQuestion();
  </script>
</body>
</html>
