<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Facts</title>
    <style>
        body {
            background-color: rgb(0, 0, 0);
            color: wheat;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            padding: 5px;

            margin-left: 100px;
            margin-right: 100px;
            font-weight: bold;
            border: 3px double powderblue;
        }

        .fact-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 800px;
            margin: auto;
        }

        .fact-text {
            font-size: 18px;
            max-width: 600px;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-buttons button {
            background-color: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .nav-buttons button:hover {
            background-color: white;
            color: rgb(70, 69, 69);
        }
    </style>
</head>
<body>

    <div class="fact-container">
        <p id="fact-text" class="fact-text"></p>
    </div>

    <div class="nav-buttons">
        <button onclick="prevFact()">&#8592;</button> <!-- Left arrow -->
        <button onclick="nextFact()">&#8594;</button> <!-- Right arrow -->
    </div>

    <script>
        let facts = [
            { text: "The Mir space station lasted 15 years – Before the ISS, Russia’s Mir was home to astronauts from multiple countries. 👨‍🚀🏢" },
            { text: "The ISS is the biggest human-made object in space – It’s as large as a football field and weighs about 420,000 kg. 🏟️🚀" },
            { text: "The Hubble Space Telescope has taken over 1.5 million images – It gave us breathtaking views of the universe since 1990. 🔭🌠" },
            { text: "The James Webb Space Telescope is even bigger – Launched in 2021, it has a gold-plated mirror the size of a house. 🏠✨" },
            { text: "China is building its own space station – The Tiangong Space Station is China’s answer to the ISS, with astronauts living aboard. 🇨🇳🛰️" }
        ];

        let currentIndex = 0;

        function updateFact() {
            document.getElementById("fact-text").textContent = facts[currentIndex].text;
        }

        function nextFact() {
            currentIndex = (currentIndex + 1) % facts.length;
            updateFact();
        }

        function prevFact() {
            currentIndex = (currentIndex - 1 + facts.length) % facts.length;
            updateFact();
        }

        // Initialize with the first fact
        updateFact();
    </script>

</body>
</html>
