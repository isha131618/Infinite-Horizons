<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Space History Quiz | Infinite Horizons</title>
<style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0b0f1a, #1a1f2e);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .quiz-container {
      background-color: #141a2b;
      border-radius: 10px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
    }
    .question {
      font-size: 22px;
      margin-bottom: 20px;
    }
    .options button {
      background-color: #1f2937;
      border: 2px solid #f4beff;
      color: #fff;
      padding: 10px 20px;
      margin: 10px 0;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 16px;
    }
    .options button:hover {
      background-color: #f4beff;
      color: #000;
    }
    .result {
      font-size: 18px;
      margin-top: 10px;
      height: 24px;
    }
    .timer {
      font-size: 18px;
      margin-bottom: 20px;
      color: #ff5252;
    }
    #scoreBoard {
      font-size: 20px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
<div class="quiz-container">
<h2>🛰️ Space History Quiz</h2>
<div class="timer" id="timer">Time Left: 10s</div>
<div class="question" id="question">Loading...</div>
<div class="options" id="options"></div>
<div class="result" id="result"></div>
<div id="scoreBoard"></div>
</div>
<script>
    const questions = [
      {
        "question": "Which country launched the first artificial satellite?",
        "options": ["USA", "Soviet Union", "China", "France"],
        "answer": "Soviet Union"
      },
      {
        "question": "What was the name of the first dog in space?",
        "options": ["Laika", "Belka", "Strelka", "Rex"],
        "answer": "Laika"
      },
      {
        "question": "Which Apollo mission was the first to land on the Moon?",
        "options": ["Apollo 10", "Apollo 11", "Apollo 12", "Apollo 13"],
        "answer": "Apollo 11"
      },
      {
        "question": "What year was the Hubble Space Telescope launched?",
        "options": ["1985", "1990", "1995", "2000"],
        "answer": "1990"
      },
      {
        "question": "Which was the first reusable spacecraft?",
        "options": ["Apollo", "Soyuz", "Space Shuttle", "Falcon 9"],
        "answer": "Space Shuttle"
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timerInterval;
    let timeLeft = 10;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const resultEl = document.getElementById("result");
    const timerEl = document.getElementById("timer");
    const scoreBoardEl = document.getElementById("scoreBoard");

    function loadQuestion() {
      clearInterval(timerInterval);
      timeLeft = 10;
      timerEl.textContent = `Time Left: ${timeLeft}s`;
      timerInterval = setInterval(updateTimer, 1000);

      const q = questions[currentQuestionIndex];
      questionEl.textContent = q.question;
      optionsEl.innerHTML = "";
      resultEl.textContent = "";

      q.options.forEach(opt => {
        const button = document.createElement("button");
        button.textContent = opt;
        button.onclick = () => handleAnswer(opt);
        optionsEl.appendChild(button);
      });
    }

    function updateTimer() {
      timeLeft--;
      timerEl.textContent = `Time Left: ${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        resultEl.textContent = `⏰ Time's up! Correct: ${questions[currentQuestionIndex].answer}`;
        disableOptions();
        setTimeout(nextQuestion, 2000);
      }
    }

    function handleAnswer(selected) {
      clearInterval(timerInterval);
      const correct = questions[currentQuestionIndex].answer;
      if (selected === correct) {
        resultEl.textContent = "✅ Correct!";
        score++;
      } else {
        resultEl.textContent = `❌ Wrong! Correct answer: ${correct}`;
      }
      disableOptions();
      setTimeout(nextQuestion, 2000);
    }

    function disableOptions() {
      const buttons = optionsEl.querySelectorAll("button");
      buttons.forEach(btn => btn.disabled = true);
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showScore();
      }
    }

    function showScore() {
      questionEl.style.display = "none";
      optionsEl.style.display = "none";
      timerEl.style.display = "none";
      resultEl.style.display = "none";
      scoreBoardEl.style.display = "block";
      scoreBoardEl.textContent = `🎉 Quiz Completed! Your Score: ${score}/${questions.length}`;
    }

    loadQuestion();
  </script>
</body>
</html>
